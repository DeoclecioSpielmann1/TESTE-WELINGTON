<!--modulo de cadastro de pessoas para sistema interno de uma empresa,
é nescessário garantir que os dados sejam inseridos corretamente e que os componentes do sistema funcionem conforme o esperado.-->
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="testes/unitario.test.js" defer></script>
    <script src="testes/component.test.js" defer></script>
</head>
<body>
    <h1>Cadastro de Pessoas</h1>
    <form id="cadastroForm">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>
    <div id="painel-testes">
        <button type="button" onclick="executarTestesUnitarios()">▶ Executar Testes unitários</button>
        <div id="resultados"></div>
    </div>
    <div id="painel-testes" style="margin-top: 1rem;">
        <button type="button" onclick="executarTestesComponente()">▶ Testes de Componente</button>
        <div id="resultados-componente"></div>
    </div>
    <div id="resultados"></div>
</body>

</html>
